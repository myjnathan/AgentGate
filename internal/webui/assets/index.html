<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentGate</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#0f1420;color:#e6ebf2}
  header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#151c2c;border-bottom:1px solid #26314a}
  h1{font-size:19px;margin:0} h1 span{color:#5ea2ff}
  main{max-width:980px;margin:0 auto;padding:22px}
  .card{background:#161e30;border:1px solid #26314a;border-radius:10px;padding:18px;margin-bottom:18px}
  input,button,select{font-size:14px;padding:8px 10px;border-radius:7px;border:1px solid #33456b;background:#0f1626;color:#e6ebf2}
  button{background:#2f6fed;border-color:#2f6fed;cursor:pointer}
  button.ghost{background:transparent}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td,th{border-bottom:1px solid #26314a;padding:6px 8px;text-align:left;vertical-align:top}
  .muted{color:#8fa1bd;font-size:13px}
  .tag{display:inline-block;padding:1px 7px;border-radius:20px;background:#243354;font-size:12px}
  .block{color:#ff7a7a}.redact{color:#ffcf6e}.allow{color:#7ddb9a}.reroute{color:#6ec3ff}
  #login{max-width:360px;margin:60px auto}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<header>
  <h1>Agent<span>Gate</span></h1>
  <div class="row">
    <span id="who" class="muted"></span>
    <button class="ghost" id="langBtn" onclick="toggleLang()">EN</button>
    <button class="ghost" id="logoutBtn" onclick="logout()" style="display:none" data-i18n="logout">退出</button>
  </div>
</header>
<main>
  <div id="login" class="card">
    <h2 data-i18n="loginTitle">登录</h2>
    <p class="muted" data-i18n="loginHint">演示账号：admin / agentgate-admin，员工：lixiaofeng / demo12345</p>
    <p><input id="lu" placeholder="username" style="width:92%"></p>
    <p><input id="lp" type="password" placeholder="password" style="width:92%"></p>
    <button onclick="login()" data-i18n="loginBtn">登录</button>
    <p id="lerr" style="color:#ff7a7a"></p>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <h3 data-i18n="deviceTitle">批准设备码（Agent 接入）</h3>
      <div class="row">
        <input id="dcode" placeholder="AG-XXXXXX">
        <input id="dname" placeholder="device name">
        <button onclick="approve()" data-i18n="approveBtn">批准</button>
        <span id="dmsg" class="muted"></span>
      </div>
      <p class="muted" data-i18n="deviceHint">员工在终端运行 ag-setup 后会得到设备码，在此批准即完成接入。</p>
    </div>
    <div class="card">
      <h3 data-i18n="channelsTitle">模型渠道</h3>
      <table id="channels"><thead><tr><th data-i18n="name">名称</th><th data-i18n="models">模型</th><th data-i18n="maxLevel">最高数据等级</th><th>Key</th><th data-i18n="health">健康</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
      <h3 data-i18n="auditTitle">审计日志（哈希链）</h3>
      <div class="row"><button class="ghost" onclick="loadAudit()" data-i18n="refresh">刷新</button><span id="chain" class="muted"></span></div>
      <table id="audit"><thead><tr><th data-i18n="time">时间</th><th data-i18n="actor">操作者</th><th>Agent</th><th data-i18n="action">动作</th><th data-i18n="level">等级</th><th data-i18n="decision">处置</th></tr></thead><tbody></tbody></table>
    </div>
  </div>
</main>
<script>
const I18N = {
  zh: {loginTitle:"登录",loginHint:"演示账号：admin / agentgate-admin，员工：lixiaofeng / demo12345",loginBtn:"登录",logout:"退出",
       deviceTitle:"批准设备码（Agent 接入）",approveBtn:"批准",deviceHint:"员工在终端运行 ag-setup 后会得到设备码，在此批准即完成接入。",
       channelsTitle:"模型渠道",name:"名称",models:"模型",maxLevel:"最高数据等级",health:"健康",auditTitle:"审计日志（哈希链）",refresh:"刷新",
       time:"时间",actor:"操作者",action:"动作",level:"等级",decision:"处置"},
  en: {loginTitle:"Sign in",loginHint:"Demo: admin / agentgate-admin, employee: lixiaofeng / demo12345",loginBtn:"Sign in",logout:"Sign out",
       deviceTitle:"Approve device code (agent onboarding)",approveBtn:"Approve",deviceHint:"An employee runs ag-setup and gets a device code; approve it here to finish onboarding.",
       channelsTitle:"Model channels",name:"Name",models:"Models",maxLevel:"Max data level",health:"Health",auditTitle:"Audit log (hash-chained)",refresh:"Refresh",
       time:"Time",actor:"Actor",action:"Action",level:"Level",decision:"Decision"}
};
let lang = localStorage.getItem("ag_lang") || "zh";
let session = localStorage.getItem("ag_session") || "";
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(I18N[lang][k]) el.textContent=I18N[lang][k]; });
  document.getElementById("langBtn").textContent = lang==="zh" ? "EN" : "中文";
}
function toggleLang(){ lang = lang==="zh" ? "en" : "zh"; localStorage.setItem("ag_lang", lang); applyLang(); }
async function api(path, opts={}){
  const res = await fetch(path, {...opts, headers:{"Content-Type":"application/json", ...(session?{Authorization:"Bearer "+session}:{})}});
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || res.status);
  return data;
}
async function login(){
  try{
    const d = await api("/api/login",{method:"POST",body:JSON.stringify({username:lu.value,password:lp.value})});
    session = d.session; localStorage.setItem("ag_session", session);
    who.textContent = d.display_name + " · " + d.department + " · " + d.role;
    login2app();
  }catch(e){ lerr.textContent = e.message; }
}
function logout(){ session=""; localStorage.removeItem("ag_session"); location.reload(); }
function login2app(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("logoutBtn").style.display="inline-block";
  loadChannels(); loadAudit();
}
async function approve(){
  try{ await api("/api/device/approve",{method:"POST",body:JSON.stringify({code:dcode.value.trim(),device_name:dname.value})});
    dmsg.textContent="✓ approved"; loadAudit(); }catch(e){ dmsg.textContent=e.message; }
}
async function loadChannels(){
  try{ const d = await api("/api/channels");
    document.querySelector("#channels tbody").innerHTML = (d.channels||[]).map(c=>
      `<tr><td>${c.name}</td><td>${(c.models||[]).join(", ")}</td><td><span class="tag">${c.max_data_level}</span></td><td>${c.key_masked||""}</td><td>${c.health||""}${c.consecutive_failures?(" ("+c.consecutive_failures+")"):""}</td></tr>`).join("");
  }catch(e){ document.querySelector("#channels tbody").innerHTML = `<tr><td colspan="5" class="muted">${e.message}</td></tr>`; }
}
async function loadAudit(){
  try{ const d = await api("/api/audit");
    document.querySelector("#audit tbody").innerHTML = (d.events||[]).map(ev=>
      `<tr><td>${(ev.time||"").slice(5,19).replace("T"," ")}</td><td>${ev.actor}</td><td>${ev.agent_type||""} ${ev.tier?('<span class="tag">'+ev.tier+'</span>'):""}</td><td>${ev.action}${ev.model?(" · "+ev.model):""}</td><td>${ev.data_level||""}</td><td class="${(ev.decision||'').split(':')[0]}">${ev.decision||""}</td></tr>`).join("");
    const v = await api("/api/audit/verify"); chain.textContent = "chain_valid: " + v.chain_valid;
  }catch(e){ chain.textContent = e.message; }
}
applyLang();
if(session){ api("/api/me").then(d=>{ who.textContent=d.display_name+" · "+d.department+" · "+d.role; login2app(); }).catch(()=>{}); }
</script>
</body>
</html>
