name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build all platforms
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in windows-amd64 linux-amd64 linux-arm64 darwin-arm64 darwin-amd64; do
            os="${p%-*}"; arch="${p#*-}"; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            d="dist/agentgate-${VERSION}-${p}"
            mkdir -p "$d"
            for b in agentgate ag-setup ag-guard; do
              ld="-s -w"
              [ "$b" = "agentgate" ] && ld="-s -w -X main.version=${VERSION}"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "$ld" -o "$d/${b}${ext}" ./cmd/$b
            done
            cp LICENSE README.md "$d/"
            (cd dist && zip -qr "agentgate-${VERSION}-${p}.zip" "agentgate-${VERSION}-${p}")
          done
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
